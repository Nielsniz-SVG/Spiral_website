<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Spiral</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard-container {
            min-height: 100vh;
            padding: 6rem 2rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-header h1 {
            font-size: 2rem;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info {
            text-align: right;
        }

        .user-email {
            color: var(--text);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .btn-logout {
            padding: 0.7rem 1.5rem;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--accent);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text);
            opacity: 0.8;
        }

        .software-section h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }

        .software-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .app-icon {
            font-size: 2rem;
        }

        .app-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: var(--accent);
            color: var(--dark);
            border-radius: 50px;
            font-weight: 600;
        }

        .app-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .app-description {
            color: var(--text);
            opacity: 0.8;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .app-type {
            font-size: 0.85rem;
            color: var(--accent-light);
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        .app-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-download,
        .btn-view {
            flex: 1;
            padding: 0.7rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: var(--dark);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-view {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-view:hover {
            background: var(--accent);
            color: var(--dark);
        }

        .app-card:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-5px);
        }

        .loading {
            text-align: center;
            padding: 3rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: var(--text);
            opacity: 0.7;
        }

        .search-box {
            margin-bottom: 2rem;
        }

        .search-box input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input::placeholder {
            color: var(--text);
            opacity: 0.5;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo-section">
                <img src="../assets/Spiral Logo.png" alt="Spiral Logo" class="logo">
                <span class="logo-text">SPIRAL</span>
            </div>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Accueil</a>
                <button id="logoutBtn" class="btn-login">Se déconnecter</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div>
                <h1>Bienvenue sur votre tableau de bord</h1>
                <p style="color: var(--text); opacity: 0.7;">Accédez à tous nos logiciels</p>
            </div>
            <div class="user-section">
                <div class="user-info">
                    <p class="user-email" id="userEmail">user@example.com</p>
                </div>
                <button id="logoutBtnAlt" class="btn-logout">Déconnexion</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="appCount">5</div>
                <div class="stat-label">Logiciels</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">100%</div>
                <div class="stat-label">Open Source</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">0€</div>
                <div class="stat-label">Prix</div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher un logiciel...">
        </div>

        <!-- Software List -->
        <div class="software-section">
            <h2>Nos logiciels</h2>
            <div class="software-grid" id="softwareGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Chargement des logiciels...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
</body>
</html>
